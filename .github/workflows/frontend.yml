name: Frontend quality

on:
  push:
    paths:
      - "frontend/**"
      - "src/retail_data_platform/api/resources*"
      - "src/retail_data_platform/api/analysis*"
      - "src/retail_data_platform/database/**"
      - "docs/saas/data-coverage.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "src/retail_data_platform/api/resources*"
      - "src/retail_data_platform/api/analysis*"
      - "src/retail_data_platform/database/**"
      - "docs/saas/data-coverage.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
      - name: Install locked public model dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-tools"
          "$RUNNER_TEMP/uv-tools/bin/pip" install uv==0.12.15
          "$RUNNER_TEMP/uv-tools/bin/uv" sync --locked --project .. --python 3.13
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check
