[project]
name = "retail-data-platform"
version = "0.1.0"
description = "Reliable ingestion and validation of retail data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.12,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.41,<1",
]

[project.scripts]
retail-data = "retail_data_platform.cli:main"
retail-api = "retail_data_platform.api.app:main"
retail-auth = "retail_data_platform.personal_auth.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.13,<0.14",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
